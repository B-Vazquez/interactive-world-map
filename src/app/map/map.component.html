<div class="container">
<div class="map" [innerHTML]="mapSvg" (click)="loadCountryDataClick($event)"></div>
  <p *ngIf="mapErrorMessage" role="alert">{{ mapErrorMessage }}</p>
  
  <form (ngSubmit)="onSubmit()">
      <div>
          <label class="search" for="text">Enter country name here:<br></label>
          <input type="text" 
          name="country" 
          [(ngModel)]="text"
          id="text" 
          placeholder="Ex: China, Australia, etc.">
      </div>
      <div>
          <button type="submit" class="btn">Submit</button>
      </div>
  </form>
  <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
</div>
